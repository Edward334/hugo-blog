baseURL = 'https://blog.astryn.top/'
languageCode = 'zh-CN'
defaultContentLanguage = 'zh-CN'
title = '苍宿影的博客'
theme = 'reimu'

[languages]
[languages.zh-CN]
languageName = '简体中文'
weight = 1
# Count CJK characters individually, otherwise Chinese text is treated as one word
# per paragraph, so WordCount/ReadingTime/excerpts are all wrong.
hasCJKLanguage = true

# Let publishDate drive the displayed date. Reimu renders .Date everywhere
# (cards, article page, RSS, sitemap); without this, publishDate is ignored.
# Falls back to `date` when publishDate is absent.
[frontmatter]
date = ["publishDate", "date"]

[markup.highlight]
guessSyntax = true
noClasses = false

[markup.goldmark.extensions.passthrough]
enable = true
delimiters.block = [["\\[", "\\]"], ["$$", "$$"]]
delimiters.inline = [["\\(", "\\)"], ["$", "$"]]
